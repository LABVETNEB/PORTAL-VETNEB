name: Backend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - chore/**
      - feat/**
      - fix/**
      - refactor/**
      - ci/**
      - test/**
      - codex/**

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-backend-impact:
    name: detect-backend-impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.detect.outputs.should_run }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect backend impact
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "Unsupported event: $EVENT_NAME" >&2
            exit 1
          fi

          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid pull request commit range." >&2
            exit 1
          fi

          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"

          if ! MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"; then
            echo "Unable to determine pull request merge base." >&2
            exit 1
          fi

          if [[ ! "$MERGE_BASE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid pull request merge base." >&2
            exit 1
          fi

          if ! git cat-file -e "${MERGE_BASE}^{commit}"; then
            echo "Pull request merge base commit is unavailable." >&2
            exit 1
          fi

          changed_file_list="${RUNNER_TEMP}/backend-changed-files"
          git diff --name-only -z --diff-filter=ACDMRTUXB "$MERGE_BASE" "$HEAD_SHA" > "$changed_file_list"

          should_run=false
          while IFS= read -r -d '' changed_path; do
            case "$changed_path" in
              docs/*|*.md)
                ;;
              *)
                should_run=true
                break
                ;;
            esac
          done < "$changed_file_list"

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

  validate-backend:
    name: backend-heavy-validation
    needs: detect-backend-impact
    if: ${{ needs.detect-backend-impact.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: portal_vetneb_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d portal_vetneb_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/portal_vetneb_ci
      SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/portal_vetneb_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint backend
        run: pnpm lint:backend

      - name: Dependency security audit
        run: |
          pnpm audit --prod
          pnpm audit

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck tests
        run: pnpm typecheck:test

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  backend-check:
    name: validate-backend
    needs:
      - detect-backend-impact
      - validate-backend
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Resolve backend validation result
        shell: bash
        env:
          DETECTOR_RESULT: ${{ needs.detect-backend-impact.result }}
          SHOULD_RUN: ${{ needs.detect-backend-impact.outputs.should_run }}
          HEAVY_RESULT: ${{ needs.validate-backend.result }}
        run: |
          set -euo pipefail

          if [[ "$DETECTOR_RESULT" != "success" ]]; then
            echo "Backend impact detector did not succeed: $DETECTOR_RESULT" >&2
            exit 1
          fi

          if [[ "$SHOULD_RUN" == "false" && "$HEAVY_RESULT" == "skipped" ]]; then
            echo "Backend validation was not required."
            exit 0
          fi

          if [[ "$SHOULD_RUN" == "true" && "$HEAVY_RESULT" == "success" ]]; then
            echo "Backend validation succeeded."
            exit 0
          fi

          echo "Unexpected backend validation state: should_run=$SHOULD_RUN heavy=$HEAVY_RESULT" >&2
          exit 1

  generate-sbom:
    # Supply-chain evidence only. No job depends on this one and the required
    # `validate-backend` context never observes its result, so it cannot block a
    # merge. Failures stay visible instead of being masked.
    name: generate-sbom
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate CycloneDX SBOM
        run: node scripts/supply-chain/generate-sbom.mjs --out sbom/portal-vetneb.cdx.json

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-cyclonedx
          path: sbom/portal-vetneb.cdx.json
          if-no-files-found: error
          retention-days: 90
