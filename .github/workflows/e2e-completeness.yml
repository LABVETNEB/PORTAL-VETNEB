name: E2E Completeness

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/e2e-completeness.yml'
      - '.github/workflows/frontend-ci.yml'
      - 'frontend/e2e/**'
      - 'frontend/playwright.config.ts'
      - 'frontend/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/governance/**'
      - 'test/architecture/e2e-suite-catalog-completeness.test.ts'
      - 'test/unit/infrastructure/e2e-completeness-workflow.test.ts'
      - 'test/unit/infrastructure/frontend-ci-workflow.test.ts'
      - 'test/unit/infrastructure/frontend-playwright-production-runner.test.ts'
      - 'test/unit/infrastructure/workflow-security-policy-contract.test.ts'
      - 'test/unit/infrastructure/workflow-security-validator-contract.test.ts'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 2'

permissions:
  contents: read

concurrency:
  group: e2e-completeness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-full-completeness:
    name: e2e-full-completeness
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify E2E catalog
        run: pnpm --dir frontend e2e:verify-catalog

      - name: Build frontend
        run: pnpm --dir frontend build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3107
          VETNEB_E2E_ALLOW_LOCAL_API: "1"
          VETNEB_E2E_DISABLE_EXTERNAL_EMBEDS: "1"

      - name: Audit built public surface
        run: pnpm security:public-surface

      - name: Install Playwright system dependencies
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail

          # `playwright install-deps` runs `apt-get update`, which fails closed on
          # every configured source. The runner image ships Google Chrome's own
          # repository — irrelevant to the system libraries Chromium needs — and that
          # repository has published inconsistent indexes (`Hash Sum mismatch`, exit
          # 100), taking the whole gate down with it. Neutralize only that source, in
          # both APT source formats the image can use: the classic one-line `.list`
          # and the Deb822 `.sources` format actually present on ubuntu-24.04 as
          # /etc/apt/sources.list.d/google-chrome.sources. `install-deps` itself is
          # unchanged and still fail-closed; absence of the source is not an error,
          # a source that survives the rewrite is.
          # Matches every Google Chrome channel the image may configure
          # (chrome/deb, chrome-stable/deb, ...) and nothing else.
          readonly target_fragment='dl.google.com/linux/chrome'

          # In paragraph mode (RS="") each Deb822 stanza is one record; FS must be
          # set to newline explicitly so each of its lines is exactly one field.
          deb822_has_active_target() {
            awk -v frag="$target_fragment" '
              BEGIN { RS = ""; FS = "\n" }
              index($0, frag) {
                disabled = 0
                for (i = 1; i <= NF; i++) {
                  if ($i ~ /^[Ee]nabled[[:space:]]*:[[:space:]]*(no|false|0)[[:space:]]*$/) disabled = 1
                }
                if (!disabled) active = 1
              }
              END { exit(active ? 0 : 1) }
            ' "$1"
          }

          list_has_active_target() {
            awk -v frag="$target_fragment" '
              index($0, frag) && $0 !~ /^[[:space:]]*#/ { active = 1 }
              END { exit(active ? 0 : 1) }
            ' "$1"
          }

          has_active_target() {
            if [[ "$1" == *.sources ]]; then
              deb822_has_active_target "$1"
            else
              list_has_active_target "$1"
            fi
          }

          disable_deb822_target() {
            awk -v frag="$target_fragment" '
              BEGIN { RS = ""; FS = "\n" }
              {
                if (stanzas++) print ""
                if (index($0, frag)) {
                  for (i = 1; i <= NF; i++) {
                    if ($i !~ /^[Ee]nabled[[:space:]]*:/) print $i
                  }
                  print "Enabled: no"
                } else {
                  print $0
                }
              }
            ' "$1"
          }

          disable_list_target() {
            awk -v frag="$target_fragment" '
              index($0, frag) && $0 !~ /^[[:space:]]*#/ {
                print "# Disabled by VETNEB CI (targeted): " $0
                next
              }
              { print }
            ' "$1"
          }

          shopt -s nullglob
          source_files=(
            /etc/apt/sources.list
            /etc/apt/sources.list.d/*.list
            /etc/apt/sources.list.d/*.sources
          )

          for source_file in "${source_files[@]}"; do
            [[ -f "$source_file" ]] || continue
            has_active_target "$source_file" || continue

            echo "Neutralizing out-of-scope APT source: ${source_file}"
            rewritten_source="$(mktemp)"
            if [[ "$source_file" == *.sources ]]; then
              disable_deb822_target "$source_file" > "$rewritten_source"
            else
              disable_list_target "$source_file" > "$rewritten_source"
            fi
            sudo cp -- "$rewritten_source" "$source_file"
            rm -f -- "$rewritten_source"

            if has_active_target "$source_file"; then
              echo "Targeted APT source remains active after rewrite: ${source_file}" >&2
              exit 1
            fi
          done

          pnpm --dir frontend exec playwright install-deps chromium

      - name: Install Playwright Chromium
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail

          readonly max_attempts=2
          readonly attempt_timeout_seconds=180
          readonly retry_delay_seconds=10

          for attempt in 1 2; do
            echo "Playwright Chromium install attempt ${attempt}/${max_attempts}"

            if timeout --signal=TERM --kill-after=15s \
              "${attempt_timeout_seconds}s" \
              pnpm --dir frontend exec playwright install chromium
            then
              echo "Playwright Chromium install succeeded on attempt ${attempt}."
              exit 0
            else
              status=$?
            fi

            if [[ "$attempt" -eq "$max_attempts" ]]; then
              echo "Playwright Chromium install failed after ${max_attempts} attempts (exit ${status})." >&2
              exit "$status"
            fi

            echo "Playwright Chromium install attempt ${attempt} failed or timed out (exit ${status}); retrying in ${retry_delay_seconds}s." >&2
            sleep "$retry_delay_seconds"
          done

      - name: Run complete cataloged E2E suite
        # Bounded retries rerun complete callbacks; they never skip or relax assertions.
        run: pnpm --dir frontend e2e:full -- --workers=2 --retries=2
        env:
          # Budget for THIS workload only. CMP grew the catalog from 91 to 95
          # specs (~1118 to ~1301 tests); measured full runs at --workers=2 went
          # from ~35.4m to ~41.2m projected, and the prior 40m budget was
          # exhausted mid-suite (`Timed out waiting 2400s`) with zero failing
          # tests. 45m restores headroom for THIS catalog size. The 60m job cap
          # keeps a 15m outer envelope for everything Playwright doesn't own —
          # checkout, install, catalog verify, build, public-surface audit,
          # browser install, and (on timeout) diagnostics upload, teardown and
          # hygiene — so a healthy suite can't be cancelled by setup overhead
          # eating into the job's hard cap.
          E2E_GLOBAL_TIMEOUT_MS: "2700000"

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-completeness-playwright-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Verify E2E teardown
        if: always()
        run: pnpm --dir frontend e2e:verify-teardown

      - name: Verify source hygiene and clean generated artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf frontend/playwright-report frontend/test-results
          git diff --exit-code -- frontend/next-env.d.ts frontend/e2e
          test -z "$(git status --short --untracked-files=all -- frontend/next-env.d.ts frontend/e2e)"
