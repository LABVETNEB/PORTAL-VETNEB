name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-frontend-impact:
    name: detect-frontend-impact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.detect.outputs.should_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect frontend impact
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "Unsupported event: $EVENT_NAME" >&2
            exit 1
          fi

          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid pull request commit range." >&2
            exit 1
          fi

          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"

          if ! MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"; then
            echo "Unable to determine pull request merge base." >&2
            exit 1
          fi

          if [[ ! "$MERGE_BASE" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid pull request merge base." >&2
            exit 1
          fi

          if ! git cat-file -e "${MERGE_BASE}^{commit}"; then
            echo "Pull request merge base commit is unavailable." >&2
            exit 1
          fi

          changed_file_list="${RUNNER_TEMP}/frontend-changed-files"
          git diff --name-only -z --diff-filter=ACDMRTUXB "$MERGE_BASE" "$HEAD_SHA" > "$changed_file_list"

          should_run=false
          while IFS= read -r -d '' changed_path; do
            case "$changed_path" in
              frontend/*|pnpm-lock.yaml|pnpm-workspace.yaml|package.json|.github/workflows/frontend-ci.yml)
                should_run=true
                break
                ;;
            esac
          done < "$changed_file_list"

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

  validate-frontend:
    name: frontend-heavy-validation
    needs: detect-frontend-impact
    if: ${{ needs.detect-frontend-impact.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.13.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm --dir frontend lint

      - name: Typecheck frontend
        run: pnpm --dir frontend typecheck

      - name: Build frontend
        run: pnpm --dir frontend build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3107
          VETNEB_E2E_ALLOW_LOCAL_API: "1"
          VETNEB_E2E_DISABLE_EXTERNAL_EMBEDS: "1"

      - name: Audit built public surface
        run: pnpm security:public-surface

      - name: Install Playwright browsers
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Run frontend E2E layered tests
        run: pnpm --dir frontend e2e:ci
        env:
          VETNEB_E2E_PRODUCTION_RUNNER: "1"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

  frontend-check:
    name: validate-frontend
    needs:
      - detect-frontend-impact
      - validate-frontend
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Resolve frontend validation result
        shell: bash
        env:
          DETECTOR_RESULT: ${{ needs.detect-frontend-impact.result }}
          SHOULD_RUN: ${{ needs.detect-frontend-impact.outputs.should_run }}
          HEAVY_RESULT: ${{ needs.validate-frontend.result }}
        run: |
          set -euo pipefail

          if [[ "$DETECTOR_RESULT" != "success" ]]; then
            echo "Frontend impact detector did not succeed: $DETECTOR_RESULT" >&2
            exit 1
          fi

          if [[ "$SHOULD_RUN" == "false" && "$HEAVY_RESULT" == "skipped" ]]; then
            echo "Frontend validation was not required."
            exit 0
          fi

          if [[ "$SHOULD_RUN" == "true" && "$HEAVY_RESULT" == "success" ]]; then
            echo "Frontend validation succeeded."
            exit 0
          fi

          echo "Unexpected frontend validation state: should_run=$SHOULD_RUN heavy=$HEAVY_RESULT" >&2
          exit 1
