name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/frontend-ci.yml'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-frontend:
    name: validate-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        run: pnpm --dir frontend lint

      - name: Typecheck frontend
        run: pnpm --dir frontend typecheck

      - name: Build frontend
        run: pnpm --dir frontend build

      - name: Audit built public surface
        run: pnpm security:public-surface

      - name: Install Playwright browsers
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Run frontend E2E layered tests
        run: |
          set +e

          pnpm --dir frontend e2e:smoke
          smoke_status=$?

          pnpm --dir frontend e2e:admin-mobile
          admin_mobile_status=$?

          pnpm --dir frontend e2e:visual-contract
          visual_contract_status=$?

          pnpm --dir frontend e2e:public-clinic
          public_clinic_status=$?

          if [ "$smoke_status" -ne 0 ] || [ "$admin_mobile_status" -ne 0 ] || [ "$visual_contract_status" -ne 0 ] || [ "$public_clinic_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
