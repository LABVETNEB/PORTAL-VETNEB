name: PR Governance

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-governance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-pr-governance:
    name: validate-pr-governance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate pull request governance
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import posixpath
          import re
          import subprocess
          import sys
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          ROOT = Path.cwd().resolve()
          EVENT_NAME = os.environ.get("GITHUB_EVENT_NAME", "")
          EVENT_PATH = os.environ.get("GITHUB_EVENT_PATH", "")
          SUMMARY_PATH = os.environ.get("GITHUB_STEP_SUMMARY")

          CATEGORY_ORDER = [
              "backend",
              "frontend",
              "tests",
              "workflows/CI",
              "database/migrations",
              "documentation",
              "dependencies/lockfiles",
              "scripts/tooling",
              "repository configuration",
              "other",
          ]

          failures = []
          notes = []
          file_entries = []
          categories = {name: [] for name in CATEGORY_ORDER}
          results = {
              "diff integrity": "NOT RUN",
              "sensitive-file policy": "NOT RUN",
              "secret scan": "NOT RUN",
              "Markdown": "NOT RUN",
              "metadata": "NOT RUN",
              "scope": "NOT RUN",
          }
          details = {
              "diff integrity": [],
              "sensitive-file policy": [],
              "secret scan": [],
              "Markdown": [],
              "metadata": [],
              "scope": [],
          }

          def add_failure(section, message):
              failures.append((section, message))
              details.setdefault(section, []).append(message)
              results[section] = "FAIL"

          def add_detail(section, message):
              details.setdefault(section, []).append(message)

          def run_git(args, check=False):
              completed = subprocess.run(
                  ["git", *args],
                  cwd=ROOT,
                  check=False,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if check and completed.returncode != 0:
                  stdout = completed.stdout.decode("utf-8", "replace").strip()
                  stderr = completed.stderr.decode("utf-8", "replace").strip()
                  raise RuntimeError(stderr or stdout or f"git {' '.join(args)} failed")
              return completed

          def git_text(args, check=True):
              completed = run_git(args, check=check)
              return completed.stdout.decode("utf-8", "replace").strip()

          def load_event():
              if not EVENT_PATH:
                  return {}
              with open(EVENT_PATH, "r", encoding="utf-8") as handle:
                  return json.load(handle)

          def ensure_commit(sha):
              if not sha or not re.fullmatch(r"[0-9a-fA-F]{40}", sha):
                  return False
              completed = run_git(["cat-file", "-e", f"{sha}^{{commit}}"])
              return completed.returncode == 0

          def determine_range(event):
              if EVENT_NAME == "pull_request":
                  pr = event.get("pull_request") or {}
                  base_sha = ((pr.get("base") or {}).get("sha") or "").strip()
                  head_sha = ((pr.get("head") or {}).get("sha") or "").strip()
                  if not base_sha or not head_sha:
                      add_failure(
                          "scope",
                          "Cannot determine pull_request base/head SHA from the event payload.",
                      )
                  else:
                      if not ensure_commit(base_sha):
                          add_failure(
                              "scope",
                              f"Base SHA {short_sha(base_sha)} is not available in the checkout.",
                          )
                      if not ensure_commit(head_sha):
                          add_failure(
                              "scope",
                              f"Head SHA {short_sha(head_sha)} is not available in the checkout.",
                          )
                  return base_sha, head_sha

              if EVENT_NAME == "workflow_dispatch":
                  head_sha = git_text(["rev-parse", "HEAD"])
                  parent = run_git(["rev-parse", "HEAD^"])
                  if parent.returncode != 0:
                      add_failure(
                          "scope",
                          "workflow_dispatch diagnostic range is HEAD^..HEAD, but HEAD has no parent.",
                      )
                      return "", head_sha
                  base_sha = parent.stdout.decode("utf-8", "replace").strip()
                  add_detail(
                      "scope",
                      "workflow_dispatch uses the diagnostic range HEAD^..HEAD on the selected ref.",
                  )
                  return base_sha, head_sha

              add_failure("scope", f"Unsupported event for PR Governance: {EVENT_NAME or '(empty)'}.")
              return "", ""

          def short_sha(value):
              return value[:12] if value else "(missing)"

          def decode_path(raw):
              return raw.decode("utf-8", "surrogateescape").replace("\\", "/")

          def changed_files(base_sha, head_sha):
              completed = run_git(
                  ["diff", "--name-status", "-z", "--diff-filter=AMRD", base_sha, head_sha],
                  check=True,
              )
              raw_tokens = completed.stdout.split(b"\0")
              if raw_tokens and raw_tokens[-1] == b"":
                  raw_tokens.pop()

              entries = []
              index = 0
              while index < len(raw_tokens):
                  status = raw_tokens[index].decode("ascii", "replace")
                  index += 1
                  if status.startswith("R"):
                      old_path = decode_path(raw_tokens[index])
                      new_path = decode_path(raw_tokens[index + 1])
                      index += 2
                      entries.append(
                          {
                              "status": status,
                              "path": new_path,
                              "old_path": old_path,
                              "display": f"{old_path} -> {new_path}",
                          }
                      )
                  else:
                      path = decode_path(raw_tokens[index])
                      index += 1
                      entries.append(
                          {
                              "status": status,
                              "path": path,
                              "old_path": None,
                              "display": path,
                          }
                      )
              return entries

          def classify(path):
              lower = path.lower()
              name = posixpath.basename(lower)

              if lower.startswith(".github/workflows/"):
                  return "workflows/CI"
              if lower.startswith("frontend/"):
                  return "frontend"
              if lower.startswith("server/"):
                  return "backend"
              if lower.startswith("test/") or "/test/" in lower or "/tests/" in lower:
                  return "tests"
              if re.search(r"(^|[._-])(test|spec)\.[cm]?[jt]sx?$", name):
                  return "tests"
              if lower.startswith("drizzle/") or "migration" in lower or name == "drizzle.config.ts":
                  return "database/migrations"
              if lower.startswith("docs/") or lower.endswith(".md"):
                  return "documentation"
              if name in {
                  "package.json",
                  "package-lock.json",
                  "pnpm-lock.yaml",
                  "pnpm-workspace.yaml",
                  "yarn.lock",
                  "npm-shrinkwrap.json",
              }:
                  return "dependencies/lockfiles"
              if lower.startswith("scripts/") or lower.startswith("tools/"):
                  return "scripts/tooling"
              if lower.startswith(".github/") or lower.startswith(".vscode/") or name in {
                  ".gitignore",
                  ".gitattributes",
                  ".npmrc",
                  ".pnpmrc",
                  "agents.md",
                  "tsconfig.json",
              }:
                  return "repository configuration"
              return "other"

          def validate_diff_integrity(base_sha, head_sha):
              completed = run_git(["diff", "--check", base_sha, head_sha])
              if completed.returncode == 0:
                  results["diff integrity"] = "PASS"
                  add_detail("diff integrity", "git diff --check completed without findings.")
                  return

              output = (
                  completed.stdout.decode("utf-8", "replace")
                  + completed.stderr.decode("utf-8", "replace")
              ).splitlines()
              sanitized = []
              for line in output[:20]:
                  match = re.match(r"^(.+?):(\d+):\s*(.+)$", line)
                  if match:
                      sanitized.append(f"{match.group(1)}:{match.group(2)}: {match.group(3)}")
                  elif line.strip():
                      sanitized.append(line.strip()[:160])
              add_failure(
                  "diff integrity",
                  "git diff --check failed: "
                  + ("; ".join(sanitized) if sanitized else "whitespace or conflict marker issue detected."),
              )

          ENV_EXAMPLE_MARKERS = ("example", "sample", "template", "stub", "mock")
          SENSITIVE_NAME_PATTERNS = (
              re.compile(r"(^|/)\.env(?:[./_-].*)?$", re.IGNORECASE),
              re.compile(r"(^|/)(id_rsa|id_dsa|id_ecdsa|id_ed25519)$", re.IGNORECASE),
              re.compile(r"(^|/)\.netrc$", re.IGNORECASE),
              re.compile(r"(^|/)(credentials?|service-account|firebase-service-account)[^/]*\.json$", re.IGNORECASE),
              re.compile(r"(^|/)(secret|secrets)[^/]*\.(json|ya?ml|txt)$", re.IGNORECASE),
              re.compile(r"(^|/).*(private|prod|production).*\.(pem|key|p12|pfx)$", re.IGNORECASE),
              re.compile(r"(^|/).*(prod|production|dump|backup).*\.(sql|dump|bak|backup)$", re.IGNORECASE),
          )

          def is_explicit_env_example(path):
              base = posixpath.basename(path).lower()
              return base.startswith(".env") and any(marker in base for marker in ENV_EXAMPLE_MARKERS)

          def sensitive_file_reason(path):
              lower = path.lower()
              if is_explicit_env_example(lower):
                  return None
              for pattern in SENSITIVE_NAME_PATTERNS:
                  if pattern.search(lower):
                      return "high-risk sensitive filename pattern"
              return None

          def validate_sensitive_files(entries):
              findings = []
              for entry in entries:
                  status = entry["status"][0]
                  if status == "D":
                      continue
                  reason = sensitive_file_reason(entry["path"])
                  if reason:
                      findings.append(f"{entry['display']} ({reason})")

              if findings:
                  add_failure(
                      "sensitive-file policy",
                      "Blocked sensitive file path(s): " + "; ".join(findings),
                  )
              else:
                  results["sensitive-file policy"] = "PASS"
                  add_detail(
                      "sensitive-file policy",
                      "No added, modified, or renamed high-risk sensitive file paths detected.",
                  )

          SECRET_PATTERNS = [
              ("private key block", re.compile(r"-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----")),
              ("GitHub token", re.compile(r"\bgh[pousr]_[A-Za-z0-9_]{36,255}\b")),
              (
                  "GitHub fine-grained token",
                  re.compile(r"\bgithub_pat_[A-Za-z0-9_]{22}_[A-Za-z0-9_]{59,255}\b"),
              ),
              ("AWS access key", re.compile(r"\b(?:AKIA|ASIA)[A-Z0-9]{16}\b")),
              ("Google API key", re.compile(r"\bAIza[0-9A-Za-z_-]{35}\b")),
              ("Stripe live secret key", re.compile(r"\bsk_live_[0-9A-Za-z]{24,}\b")),
              ("OpenAI project key", re.compile(r"\bsk-proj-[A-Za-z0-9_-]{20,}\b")),
              (
                  "production credential URL",
                  re.compile(
                      r"\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis)://[^:@\s/]+:[^@\s]+@[^/\s]+",
                      re.IGNORECASE,
                  ),
              ),
              (
                  "explicit production secret assignment",
                  re.compile(
                      r"\b(?:PROD|PRODUCTION)_[A-Z0-9_]*(?:SECRET|TOKEN|PASSWORD|API_KEY)\s*[:=]\s*[\"']?[A-Za-z0-9_./+=-]{16,}",
                      re.IGNORECASE,
                  ),
              ),
          ]
          PLACEHOLDER_RE = re.compile(
              r"(?i)(example|placeholder|dummy|fake|sample|changeme|change-me|your[_-]|xxx|xxxxx|<[^>]+>|\.\.\.|localhost|127\.0\.0\.1|example\.com)"
          )

          def is_placeholder_line(line):
              return bool(PLACEHOLDER_RE.search(line))

          def parse_added_lines(base_sha, head_sha):
              completed = run_git(
                  ["diff", "--unified=0", "--no-ext-diff", "--no-color", base_sha, head_sha],
                  check=True,
              )
              diff_text = completed.stdout.decode("utf-8", "replace").splitlines()
              current_file = None
              new_line = None

              for line in diff_text:
                  if line.startswith("+++ "):
                      marker = line[4:]
                      current_file = None if marker == "/dev/null" else marker.removeprefix("b/")
                      continue

                  if line.startswith("@@ "):
                      match = re.search(r"\+(\d+)(?:,(\d+))?", line)
                      new_line = int(match.group(1)) if match else None
                      continue

                  if current_file is None or new_line is None:
                      continue

                  if line.startswith("+") and not line.startswith("+++ "):
                      yield current_file, new_line, line[1:]
                      new_line += 1
                  elif line.startswith("-") and not line.startswith("--- "):
                      continue
                  else:
                      new_line += 1

          def validate_secret_scan(base_sha, head_sha):
              findings = []
              for path, line_number, line in parse_added_lines(base_sha, head_sha):
                  if is_placeholder_line(line):
                      continue
                  for label, pattern in SECRET_PATTERNS:
                      if pattern.search(line):
                          findings.append((path, line_number, label))
                          break

              if findings:
                  rendered = "; ".join(
                      f"{path}:{line_number} ({label})" for path, line_number, label in findings[:30]
                  )
                  suffix = "" if len(findings) <= 30 else f"; +{len(findings) - 30} more"
                  add_failure(
                      "secret scan",
                      "High-confidence secret pattern(s) found in added lines: " + rendered + suffix,
                  )
              else:
                  results["secret scan"] = "PASS"
                  add_detail("secret scan", "No high-confidence secret patterns detected in added lines.")

          MARKDOWN_LINK_RE = re.compile(r"!?\[[^\]\n]*(?:\][^\[\]\n]*)?\]\(([^)\n]+)\)")
          EXTERNAL_SCHEMES = {
              "http",
              "https",
              "mailto",
              "tel",
              "ftp",
              "ftps",
              "data",
          }

          def markdown_entries(entries):
              selected = []
              for entry in entries:
                  if entry["status"][0] == "D":
                      continue
                  if entry["path"].lower().endswith(".md"):
                      selected.append(entry["path"])
              return selected

          def extract_link_target(raw_target):
              target = raw_target.strip()
              if not target:
                  return ""
              if target.startswith("<") and ">" in target:
                  return target[1 : target.index(">")].strip()
              title_match = re.match(r"(.+?)\s+([\"']).*\2\s*$", target)
              if title_match:
                  return title_match.group(1).strip()
              return target

          def validate_markdown(entries):
              markdown_files = markdown_entries(entries)
              if not markdown_files:
                  results["Markdown"] = "PASS"
                  add_detail("Markdown", "No added or modified Markdown files.")
                  return

              broken = []
              for relative_file in markdown_files:
                  file_path = ROOT / relative_file
                  try:
                      data = file_path.read_bytes()
                  except OSError as exc:
                      broken.append(f"{relative_file}: cannot read file ({exc.__class__.__name__})")
                      continue

                  if b"\x00" in data:
                      broken.append(f"{relative_file}: contains NUL byte")
                      continue

                  try:
                      content = data.decode("utf-8")
                  except UnicodeDecodeError:
                      broken.append(f"{relative_file}: is not valid UTF-8")
                      continue

                  for line_number, line in enumerate(content.splitlines(), start=1):
                      if re.match(r"^(<<<<<<< .+|=======$|>>>>>>> .+)$", line):
                          broken.append(f"{relative_file}:{line_number}: conflict marker")

                  base_dir = posixpath.dirname(relative_file)
                  for match in MARKDOWN_LINK_RE.finditer(content):
                      target = extract_link_target(match.group(1))
                      if not target:
                          continue

                      parsed = urlsplit(target)
                      if parsed.scheme.lower() in EXTERNAL_SCHEMES or target.startswith("//"):
                          continue
                      if target.startswith("#"):
                          continue

                      link_path = unquote(parsed.path)
                      if not link_path:
                          continue

                      if link_path.startswith("/"):
                          normalized = posixpath.normpath(link_path.lstrip("/"))
                      else:
                          normalized = posixpath.normpath(posixpath.join(base_dir, link_path))

                      candidate = (ROOT / normalized).resolve()
                      try:
                          candidate.relative_to(ROOT)
                      except ValueError:
                          broken.append(f"{relative_file}: local link leaves repository ({target})")
                          continue

                      if not candidate.exists():
                          broken.append(f"{relative_file}: broken local link ({target})")

              if broken:
                  add_failure("Markdown", "Markdown validation failed: " + "; ".join(broken[:30]))
              else:
                  results["Markdown"] = "PASS"
                  add_detail(
                      "Markdown",
                      f"Validated {len(markdown_files)} Markdown file(s) for UTF-8, NUL bytes, conflict markers, and local links.",
                  )

          def section_present(body, section):
              pattern = rf"^\s*##\s+{re.escape(section)}\b"
              return re.search(pattern, body, flags=re.IGNORECASE | re.MULTILINE) is not None

          def extract_scope_text(body):
              match = re.search(r"^\s*##\s+scope\b(?P<body>.*?)(?=^\s*##\s+|\Z)", body, flags=re.IGNORECASE | re.MULTILINE | re.DOTALL)
              return match.group("body") if match else ""

          def validate_metadata(event):
              if EVENT_NAME != "pull_request":
                  results["metadata"] = "N/A"
                  add_detail("metadata", "Skipped for workflow_dispatch.")
                  return "", False, False

              pr = event.get("pull_request") or {}
              body = pr.get("body") or ""
              if not body.strip():
                  add_failure("metadata", "PR body is required and cannot be empty.")
                  return "", False, False

              required = ["Summary", "Scope", "Validation", "Rollback"]
              missing = [section for section in required if not section_present(body, section)]
              if missing:
                  add_failure("metadata", "PR body is missing required section(s): " + ", ".join(missing))
              else:
                  results["metadata"] = "PASS"
                  add_detail("metadata", "Required PR body sections are present.")

              scope_text = extract_scope_text(body)
              scope_area = f"{scope_text}\n{pr.get('title') or ''}"
              docs_only = re.search(r"\b(?:docs|documentation)[ -]?only\b", scope_area, re.IGNORECASE) is not None
              ci_only = re.search(r"\b(?:ci|workflow|workflows)[ -]?only\b", scope_area, re.IGNORECASE) is not None
              add_detail("scope", f"Exclusive scope signals: docs-only={docs_only}, CI-only={ci_only}.")
              return scope_text, docs_only, ci_only

          def validate_scope(entries, docs_only, ci_only):
              touched_categories = sorted(
                  {classify(entry["path"]) for entry in entries},
                  key=lambda item: CATEGORY_ORDER.index(item),
              )
              add_detail("scope", "Detected categories: " + (", ".join(touched_categories) or "(none)"))

              if docs_only:
                  outside_docs = [
                      entry["display"]
                      for entry in entries
                      if classify(entry["path"]) != "documentation"
                  ]
                  if outside_docs:
                      add_failure(
                          "scope",
                          "PR explicitly claims docs-only but changes non-documentation path(s): "
                          + "; ".join(outside_docs),
                      )
                      return
                  results["scope"] = "PASS"
                  add_detail("scope", "Explicit docs-only claim is compatible with documentation changes.")
                  return

              if ci_only:
                  outside_github = [
                      entry["display"]
                      for entry in entries
                      if not entry["path"].lower().startswith(".github/")
                  ]
                  if outside_github:
                      add_failure(
                          "scope",
                          "PR explicitly claims CI-only but changes path(s) outside .github/**: "
                          + "; ".join(outside_github),
                      )
                      return
                  results["scope"] = "PASS"
                  add_detail("scope", "Explicit CI-only claim is compatible with .github/** changes.")
                  return

              if results["scope"] != "FAIL":
                  results["scope"] = "PASS"
                  add_detail("scope", "No exclusive docs-only or CI-only claim detected.")

          def markdown_escape(value):
              return str(value).replace("|", "\\|").replace("\n", " ")

          def write_summary(event_name, base_sha, head_sha):
              if not SUMMARY_PATH:
                  return
              status = "PASS" if not failures else "FAIL"
              with open(SUMMARY_PATH, "a", encoding="utf-8") as summary:
                  summary.write("### PR Governance\n\n")
                  summary.write("| Field | Value |\n")
                  summary.write("| --- | --- |\n")
                  summary.write(f"| event | `{markdown_escape(event_name or '(unknown)')}` |\n")
                  summary.write(f"| base SHA | `{short_sha(base_sha)}` |\n")
                  summary.write(f"| head SHA | `{short_sha(head_sha)}` |\n")
                  summary.write(f"| files | `{len(file_entries)}` |\n\n")

                  summary.write("#### Categories\n\n")
                  summary.write("| Category | Count |\n")
                  summary.write("| --- | ---: |\n")
                  for category in CATEGORY_ORDER:
                      summary.write(f"| {category} | {len(categories[category])} |\n")

                  summary.write("\n#### Files\n\n")
                  summary.write("| Status | Category | Path |\n")
                  summary.write("| --- | --- | --- |\n")
                  for entry in file_entries:
                      summary.write(
                          f"| `{markdown_escape(entry['status'])}` | {classify(entry['path'])} | `{markdown_escape(entry['display'])}` |\n"
                      )

                  summary.write("\n#### Validation Results\n\n")
                  summary.write("| Check | Result | Detail |\n")
                  summary.write("| --- | --- | --- |\n")
                  for check_name in [
                      "diff integrity",
                      "sensitive-file policy",
                      "secret scan",
                      "Markdown",
                      "metadata",
                      "scope",
                  ]:
                      detail = "; ".join(details.get(check_name, [])) or "-"
                      summary.write(
                          f"| {check_name} | `{results[check_name]}` | {markdown_escape(detail)} |\n"
                      )

                  summary.write("\n#### Conclusion\n\n")
                  summary.write(f"`{status}`\n")

          def main():
              event = load_event()
              base_sha, head_sha = determine_range(event)

              if base_sha and head_sha and ensure_commit(base_sha) and ensure_commit(head_sha):
                  global file_entries
                  try:
                      file_entries = changed_files(base_sha, head_sha)
                  except Exception as exc:
                      add_failure("scope", f"Cannot build changed-file manifest: {exc}")
                      file_entries = []

                  if not file_entries:
                      add_failure("scope", "The comparison range contains no added, modified, renamed, or deleted files.")

                  for entry in file_entries:
                      categories[classify(entry["path"])].append(entry["display"])

                  if file_entries:
                      validate_diff_integrity(base_sha, head_sha)
                      validate_sensitive_files(file_entries)
                      validate_secret_scan(base_sha, head_sha)
                      validate_markdown(file_entries)
                      _, docs_only, ci_only = validate_metadata(event)
                      validate_scope(file_entries, docs_only, ci_only)
                  else:
                      for check_name in [
                          "diff integrity",
                          "sensitive-file policy",
                          "secret scan",
                          "Markdown",
                          "metadata",
                      ]:
                          if results[check_name] == "NOT RUN":
                              results[check_name] = "SKIPPED"
              else:
                  for check_name in [
                      "diff integrity",
                      "sensitive-file policy",
                      "secret scan",
                      "Markdown",
                      "metadata",
                  ]:
                      if results[check_name] == "NOT RUN":
                          results[check_name] = "SKIPPED"

              write_summary(EVENT_NAME, base_sha, head_sha)

              if failures:
                  for section, message in failures:
                      print(f"::error title=PR Governance {section}::{message}")
                  return 1

              print("PR Governance passed.")
              return 0

          sys.exit(main())
          PY
