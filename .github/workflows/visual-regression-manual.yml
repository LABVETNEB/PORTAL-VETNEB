name: Visual Regression Manual

run-name: "Visual regression ${{ inputs.suite }} (runner=${{ inputs.runner }}, update_snapshots=${{ inputs.update_snapshots }})"

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Visual suite to run."
        required: true
        default: all
        type: choice
        options:
          - all
          - public
          - authenticated
          - stress
      runner:
        description: "production-candidate: next build + next start into an isolated candidate compared against the canonical production baselines; never updates them. dev: non-canonical next dev diagnostic; differs from the production baselines by design and never updates them."
        required: true
        default: production-candidate
        type: choice
        options:
          - dev
          - production-candidate
      update_snapshots:
        description: "Always rejected: canonical baselines are next start captures promoted from reviewed production-candidate evidence (E2E-GLOBAL-05B)."
        required: true
        default: false
        type: boolean
      upload_artifacts:
        description: "Upload Playwright reports, test results and PNG evidence."
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: visual-regression-manual-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: false

jobs:
  visual-regression:
    name: visual-regression-${{ inputs.suite }}
    runs-on: ubuntu-latest
    # The candidate caps Playwright at 20 minutes, leaving at least 25 minutes
    # of job budget for setup, build, teardown, evidence and artifact upload.
    timeout-minutes: 45

    env:
      CI: true
      VISUAL_SUITE: ${{ inputs.suite }}

    steps:
      # Canonical baselines are next start captures (E2E-GLOBAL-05B). No runner may
      # write them: a dev render would silently reverse the promotion, and a
      # production candidate becomes a baseline only through a reviewed PR.
      - name: Reject canonical snapshot updates
        if: ${{ inputs.update_snapshots }}
        run: |
          echo "::error::update_snapshots is not supported: canonical baselines are promoted byte-exact from reviewed production-candidate evidence (E2E-GLOBAL-05B)."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Enable corepack
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm --version

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only

      - name: Install Playwright Chromium
        run: corepack pnpm --dir frontend exec playwright install --with-deps chromium

      # Non-canonical diagnostic: next dev against the production baselines.
      - name: Run selected visual regression suite
        if: ${{ inputs.runner == 'dev' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${RUNNER_OS}" != "Linux" ]; then
            echo "::error::Visual snapshots are versioned only for Chromium Linux."
            exit 1
          fi

          case "${VISUAL_SUITE}" in
            all)
              specs=(
                "e2e/regression/visual/visual-regression-public.spec.ts"
                "e2e/regression/visual/visual-regression-authenticated.spec.ts"
                "e2e/regression/visual/visual-regression-stress.spec.ts"
              )
              ;;
            public)
              specs=("e2e/regression/visual/visual-regression-public.spec.ts")
              ;;
            authenticated)
              specs=("e2e/regression/visual/visual-regression-authenticated.spec.ts")
              ;;
            stress)
              specs=("e2e/regression/visual/visual-regression-stress.spec.ts")
              ;;
            *)
              echo "::error::Invalid suite: ${VISUAL_SUITE}"
              exit 1
              ;;
          esac

          cmd=(corepack pnpm --dir frontend exec playwright test "${specs[@]}" --project=chromium)

          printf 'Running:'
          printf ' %q' "${cmd[@]}"
          printf '\n'

          "${cmd[@]}"

      - name: Produce production visual candidate
        if: ${{ inputs.runner == 'production-candidate' }}
        shell: bash
        env:
          E2E_GLOBAL_TIMEOUT_MS: "1200000"
        run: |
          set -euo pipefail

          corepack pnpm --dir frontend e2e:visual-production-candidate -- \
            --suite "${VISUAL_SUITE}" \
            --evidence-dir "${RUNNER_TEMP}/visual-production-candidate"

      # Raw Playwright output (including the candidate's playwright/ evidence) can
      # hold cookies and auth headers; only the sanitized staging copy is uploaded.
      - name: Sanitize Playwright artifacts
        id: sanitize-playwright-artifacts
        if: ${{ always() && inputs.upload_artifacts }}
        timeout-minutes: 5
        run: node scripts/security/playwright-artifact-sanitizer.mjs --output "${RUNNER_TEMP}/playwright-sanitized" --input frontend/playwright-report --input frontend/test-results --input "${RUNNER_TEMP}/visual-production-candidate"

      - name: Upload Playwright artifacts
        if: ${{ always() && inputs.upload_artifacts && steps.sanitize-playwright-artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-${{ inputs.suite }}-playwright-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/playwright-sanitized/playwright-report/
            ${{ runner.temp }}/playwright-sanitized/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload snapshot PNGs
        if: ${{ always() && inputs.upload_artifacts && inputs.runner == 'dev' && failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-${{ inputs.suite }}-snapshots-${{ github.run_attempt }}
          path: frontend/e2e/**/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload production visual candidate evidence
        if: ${{ always() && inputs.upload_artifacts && inputs.runner == 'production-candidate' && steps.sanitize-playwright-artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-${{ inputs.suite }}-production-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/playwright-sanitized/visual-production-candidate/
          if-no-files-found: ignore
          retention-days: 14
