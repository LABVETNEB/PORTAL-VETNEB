name: Visual Regression Manual

run-name: "Visual regression ${{ inputs.suite }} (runner=${{ inputs.runner }}, update_snapshots=${{ inputs.update_snapshots }})"

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Visual suite to run."
        required: true
        default: all
        type: choice
        options:
          - all
          - public
          - authenticated
          - stress
      runner:
        description: "dev: compare (or update) the canonical baselines under next dev. production-candidate: next build + next start into an isolated candidate compared against the canonical baselines; never updates them."
        required: true
        default: dev
        type: choice
        options:
          - dev
          - production-candidate
      update_snapshots:
        description: "Update visual snapshots in the ephemeral CI workspace (dev runner only)."
        required: true
        default: false
        type: boolean
      upload_artifacts:
        description: "Upload Playwright reports, test results and PNG evidence."
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: visual-regression-manual-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: false

jobs:
  visual-regression:
    name: visual-regression-${{ inputs.suite }}
    runs-on: ubuntu-latest
    # The candidate caps Playwright at 20 minutes, leaving at least 25 minutes
    # of job budget for setup, build, teardown, evidence and artifact upload.
    timeout-minutes: 45

    env:
      CI: true
      VISUAL_SUITE: ${{ inputs.suite }}
      UPDATE_SNAPSHOTS: ${{ inputs.update_snapshots }}

    steps:
      - name: Reject snapshot updates for the production candidate
        if: ${{ inputs.runner == 'production-candidate' && inputs.update_snapshots }}
        run: |
          echo "::error::runner=production-candidate never updates snapshots; promoting a candidate to baseline is a separate reviewed step (E2E-GLOBAL-05B)."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Enable corepack
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm --version

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile --reporter=append-only

      - name: Install Playwright Chromium
        run: corepack pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Run selected visual regression suite
        if: ${{ inputs.runner == 'dev' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${RUNNER_OS}" != "Linux" ]; then
            echo "::error::Visual snapshots are versioned only for Chromium Linux."
            exit 1
          fi

          case "${VISUAL_SUITE}" in
            all)
              specs=(
                "e2e/regression/visual/visual-regression-public.spec.ts"
                "e2e/regression/visual/visual-regression-authenticated.spec.ts"
                "e2e/regression/visual/visual-regression-stress.spec.ts"
              )
              ;;
            public)
              specs=("e2e/regression/visual/visual-regression-public.spec.ts")
              ;;
            authenticated)
              specs=("e2e/regression/visual/visual-regression-authenticated.spec.ts")
              ;;
            stress)
              specs=("e2e/regression/visual/visual-regression-stress.spec.ts")
              ;;
            *)
              echo "::error::Invalid suite: ${VISUAL_SUITE}"
              exit 1
              ;;
          esac

          cmd=(corepack pnpm --dir frontend exec playwright test "${specs[@]}" --project=chromium)

          if [ "${UPDATE_SNAPSHOTS}" = "true" ]; then
            cmd+=(--update-snapshots)
          fi

          printf 'Running:'
          printf ' %q' "${cmd[@]}"
          printf '\n'

          "${cmd[@]}"

      - name: Produce production visual candidate
        if: ${{ inputs.runner == 'production-candidate' }}
        shell: bash
        env:
          E2E_GLOBAL_TIMEOUT_MS: "1200000"
        run: |
          set -euo pipefail

          corepack pnpm --dir frontend e2e:visual-production-candidate -- \
            --suite "${VISUAL_SUITE}" \
            --evidence-dir "${RUNNER_TEMP}/visual-production-candidate"

      - name: Upload Playwright artifacts
        if: ${{ always() && inputs.upload_artifacts }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-${{ inputs.suite }}-playwright-${{ github.run_attempt }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload snapshot PNGs
        if: ${{ always() && inputs.upload_artifacts && inputs.runner == 'dev' && (inputs.update_snapshots || failure()) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-${{ inputs.suite }}-snapshots-${{ github.run_attempt }}
          path: frontend/e2e/**/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload production visual candidate evidence
        if: ${{ always() && inputs.upload_artifacts && inputs.runner == 'production-candidate' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-${{ inputs.suite }}-production-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/visual-production-candidate/
          if-no-files-found: ignore
          retention-days: 14
