  esbuild: "0.28.1"
  "fast-uri@<3.1.4": "3.1.4"
  "fast-uri@>=4.0.0 <4.1.1": "4.1.1"
  "find-my-way@<=9.6.0": "9.7.0"
  "sharp@<0.35.0": "0.35.3"
  "postcss@<=8.5.17": "8.5.19"
  "ws@>=8.0.0 <8.20.1": "8.20.1"
  "js-yaml@<=5.2.1": "5.2.2"

allowBuilds:
  argon2: false
  esbuild: false
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - js-yaml@5.2.2
